[project]
name = "internal-rag"
version = "0.1.0"
description = "公司内部 RAG 系统（LlamaIndex + FastMCP），本地离线开发版"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-index-core>=0.12.0",
    "llama-index-readers-file>=0.4.0",
    "llama-index-embeddings-fastembed>=0.4.0",
    "fastembed>=0.4.0",
    "llama-index-llms-ollama>=0.5.0",
    "mcp>=1.2.0",
    "PyYAML>=6.0",
    "bm25s>=0.3.11",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "docx2txt>=0.8",
    "python-pptx>=1.0.0",
    "reportlab>=4.2.0",
    "llama-index-llms-openai>=0.7.10",
    "fastmcp>=3.4.7",
    "openpyxl",
    "rapidocr-onnxruntime",
]

# 可选：GPU 嵌入（bge-m3 走 sentence-transformers 需要 torch）
# 本机: uv sync --extra gpu-embed
# 公司电脑: 普通 uv sync（无需 torch，用 fastembed 的 jina-zh 即可）
[project.optional-dependencies]
images = ["pypdfium2>=4.30,<6"]
gpu-embed = [
    "torch",
    "sentence-transformers",
    "llama-index-embeddings-huggingface>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.uv]
package = true
# uv 全局缓存目录在本机权限异常（AppData\Local\uv\cache 拒绝访问），
# 把缓存指到项目内 .uv-cache（也避免污染全局）
cache-dir = ".uv-cache"
